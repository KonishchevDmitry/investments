[package]
name = "investments"
version = "8.5.0"
description = "Helps you with managing your investments"
keywords = ["finance", "investment", "stocks", "trading", "taxes"]
categories = ["command-line-utilities"]

authors = ["Dmitry Konishchev <konishchev@gmail.com>"]
repository = "https://github.com/KonishchevDmitry/investments"
documentation = "https://github.com/KonishchevDmitry/investments"
license = "GPL-3.0+"
readme = "README.md"

edition = "2024"
exclude = ["/src/quotes/tbank/specs", "/testdata"]

[[bin]]
name = "investments"
path = "src/bin/investments/mod.rs"

[lints.clippy]
collapsible_if = "allow"
# FIXME(konishchev): Looks broken, revisit it
collapsible_match = "allow"
comparison_chain = "allow"
derive_partial_eq_without_eq = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
obfuscated_if_else = "allow"
redundant_field_names = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unit_arg = "allow"

[profile.release]
codegen-units = 1
lto = true

[dependencies]
ansi_term = "0.12.1"
async-stream = "0.3.6"
backoff = "0.4.0"
bitflags = "2.13.2"
# FIXME(konishchev): 0.37-0.38 versions are broken (https://github.com/tafia/calamine/issues/798)
# Waiting for https://github.com/tafia/calamine/pull/804 which fixes the issue
calamine = "0.36.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
cast = "0.3.0"
clap = "4.6.9"
clap_complete = "4.6.12"
csv = "1.4.0"
cusip = "0.3.3"
dyn-clone = "1.0.20"
easy-logging = "1.1.0"
encoding_rs = "0.8.44"
futures-core = "0.3.34"
governor = "0.10.4"
indoc = "2.0.8"
isin = "0.1.19"
itertools = "0.15.0"
lazy_static = "1.5.1"
log = "0.4.35"
maplit = "1.0.2"
matches = "0.1.10"
maybe-owned = "0.3.4"
num-integer = "0.1.47"
num-traits = "0.2.19"
platforms = "4.4.0"
prettytable-rs = "0.10.0"
prometheus = "0.14.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rayon = "1.12.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "stream"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
rust_decimal_macros = "1.40.0"
scraper = "0.29.0"
separator = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-xml-rs = "0.8.2"
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
shellexpand = "3.1.2"
strum = { version = "0.28", features = ["derive"] }
textwrap = "0.16.4"
tokio = "1.54.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
xml-rs = "1.0.0"

diesel = { version = "2.4.0", features = ["sqlite", "chrono"] }
diesel_migrations = "2.4.0"
diesel-derive-enum = { version = "2.1.0", features = ["sqlite"] }
# Force static linking
libsqlite3-sys = { version = ">=0.17.2, <0.41.0", features = ["bundled"] }

prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

# FIXME(konishchev): A workaround for broken colored table rendering (https://github.com/phsym/prettytable-rs/issues/165)
unicode-width = "=0.1.12"

static_table_derive = "0.1.85"
xls_table_derive = "0.8.15"

[patch.crates-io]
static_table_derive = { path = "src/formatting/static_table_derive" }
xls_table_derive = { path = "src/formats/xls/xls_table_derive" }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
mockito = "1.7.2"
pretty_assertions = "1.4.1"
qtrac-retest = { path = "tests/retest" } # The original crate has been removed from crates.io (https://github.com/KonishchevDmitry/investments/issues/84)
rstest = "0.28.0"
tempfile = "3.27.0"
url = "2.5.8"
